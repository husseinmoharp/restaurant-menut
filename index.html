<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كبابجي وبروست ابن مصر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background-color: #0b0c10; color: #fff; }</style>
</head>
<body class="pb-28">
    <header class="p-4 bg-gray-900 border-b border-gray-800 flex justify-between items-center sticky top-0 z-40">
        <div>
            <h1 class="font-black text-yellow-500 text-base">كبابجي وبروست ابن مصر</h1>
            <p class="text-xs text-gray-400">طامية - مساكن الزراعة</p>
        </div>
        <button onclick="document.getElementById('admin').classList.remove('hidden')" class="bg-gray-800 p-2 rounded-xl text-xs text-yellow-500 font-bold"><i class="fa-solid fa-gear"></i> الإدارة</button>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4">
        <div id="categories" class="flex gap-2 overflow-x-auto py-1"></div>
        <div id="grid" class="grid grid-cols-1 gap-3"></div>
    </main>

    <div id="cart-bar" class="fixed bottom-4 left-4 right-4 max-w-xl mx-auto bg-yellow-500 text-black p-3 rounded-2xl flex justify-between items-center font-bold hidden cursor-pointer shadow-lg" onclick="sendOrder()">
        <span>إرسال الطلب (<span id="cart-count">0</span>)</span>
        <span id="cart-total">0.00 ج.م</span>
    </div>

    <!-- Admin Modal -->
    <div id="admin" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 p-5 rounded-2xl w-full max-w-md space-y-3 border border-gray-800">
            <div class="flex justify-between items-center font-bold text-yellow-500">
                <span>لوحة التحكم (تعديل الأسعار)</span>
                <button onclick="document.getElementById('admin').classList.add('hidden')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <input type="password" id="pass" placeholder="كلمة المرور (admin123)" class="w-full bg-gray-800 p-2.5 rounded-lg text-xs outline-none border border-gray-700">
            <button onclick="checkAdmin()" class="w-full bg-yellow-500 text-black font-bold p-2.5 rounded-lg text-xs">دخول</button>
            <div id="admin-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('menu')) || [
            {id: 1, name: "وجبة بروست 1 قطعة", price: 80, cat: "البروست", desc: "قطعة بروست مقرمشة مع الخبز", img: "https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?w=300"},
            {id: 2, name: "وجبة بروست 2 قطعة", price: 105, cat: "البروست", desc: "2 قطعة بروست مقرمشة مع الصوصات", img: "https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?w=300"},
            {id: 3, name: "فرخة شيش كاملة", price: 320, cat: "المشويات", desc: "مشوية على الفحم مع المقبلات", img: "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=300"},
            {id: 4, name: "كباب ضاني ربع كيلو", price: 300, cat: "المشويات", desc: "كباب ضاني بلدي طازج", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=300"}
        ];
        let cart = {};
        let currentCat = 'الكل';

        function render() {
            let cats = ['الكل', ...new Set(items.map(i => i.cat))];
            document.getElementById('categories').innerHTML = cats.map(c => `
                <button onclick="currentCat='${c}';render()" class="px-3.5 py-1.5 rounded-full text-xs whitespace-nowrap transition ${currentCat === c ? 'bg-yellow-500 text-black font-bold' : 'bg-gray-800 text-gray-300'}">${c}</button>
            `).join('');

            let filtered = currentCat === 'الكل' ? items : items.filter(i => i.cat === currentCat);
            document.getElementById('grid').innerHTML = filtered.map(i => `
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-3 flex gap-3 items-center shadow">
                    <img src="${i.img}" class="w-20 h-20 rounded-lg object-cover border border-gray-800">
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-xs truncate">${i.name}</h3>
                        <p class="text-[10px] text-gray-400 line-clamp-1 my-0.5">${i.desc}</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-yellow-500 font-bold text-xs">${i.price} ج.م</span>
                            <button onclick="add(${i.id})" class="bg-yellow-500 hover:bg-yellow-400 text-black px-3 py-1 rounded-lg text-xs font-bold transition">+ إضافة</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function add(id) {
            let item = items.find(i => i.id === id);
            if (!cart[id]) cart[id] = {...item, qty: 0};
            cart[id].qty++;
            updateCart();
        }

        function updateCart() {
            let count = Object.values(cart).reduce((a, b) => a + b.qty, 0);
            let total = Object.values(cart).reduce((a, b) => a + (b.price * b.qty), 0);
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = total + ' ج.م';
            document.getElementById('cart-bar').classList.toggle('hidden', count === 0);
        }

        function sendOrder() {
            let msg = "*طلب جديد من كبابجي وبروست ابن مصر:*\n\n";
            Object.values(cart).forEach(i => {
                msg += `• ${i.name} x${i.qty} = ${i.price * i.qty} ج.م\n`;
            });
            let total = Object.values(cart).reduce((a, b) => a + (b.price * b.qty), 0);
            msg += `\n*الإجمالي الصافي:* ${total} ج.م`;
            window.open(`https://wa.me/201040062596?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function checkAdmin() {
            if (document.getElementById('pass').value === 'admin123') {
                document.getElementById('admin-list').innerHTML = items.map(i => `
                    <div class="flex justify-between items-center bg-gray-800 p-2 rounded-lg text-xs">
                        <span class="truncate max-w-[150px]">${i.name}</span>
                        <div class="flex items-center gap-1">
                            <input type="number" value="${i.price}" onchange="items.find(x=>x.id===${i.id}).price=Number(this.value);localStorage.setItem('menu',JSON.stringify(items));render()" class="w-16 bg-gray-700 text-yellow-500 font-bold text-center p-1 rounded outline-none">
                            <span>ج.م</span>
                        </div>
                    </div>
                `).join('');
            } else {
                alert('كلمة المرور غير صحيحة');
            }
        }

        render();
    </script>
</body>
</html>
